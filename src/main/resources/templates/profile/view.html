<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Мой профиль | Unio</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-color: #ff4d6d;
            --secondary-color: #ff8fa3;
            --dark-color: #2b2d42;
            --light-bg: #f8f9fa;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--light-bg);
            color: var(--dark-color);
        }

        .profile-container {
            max-width: 800px;
            margin: 30px auto;
            padding: 20px;
        }

        .profile-card {
            background: white;
            border-radius: 15px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.1);
            overflow: hidden;
            position: relative;
        }

        .profile-header {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            padding: 25px;
            position: relative;
            text-align: center;
        }

        .profile-header h1 {
            font-weight: 700;
            margin: 0;
            font-size: 1.8rem;
        }

        .btn-back {
            position: absolute;
            left: 20px;
            top: 20px;
            color: white;
            background: rgba(255,255,255,0.2);
            border: none;
            border-radius: 50px;
            padding: 8px 15px;
            transition: all 0.3s;
        }

        .btn-back:hover {
            background: rgba(255,255,255,0.3);
            transform: translateX(-3px);
        }

        .profile-content {
            padding: 30px;
        }

        .profile-main-info {
            display: flex;
            align-items: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 30px;
        }

        .profile-photo {
            width: 150px;
            height: 150px;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            position: relative;
            flex-shrink: 0;
        }

        .profile-photo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .no-photo {
            width: 100%;
            height: 100%;
            background: #e9ecef;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #6c757d;
            font-weight: 500;
        }

        .profile-name-section {
            flex: 1;
            min-width: 200px;
        }

        .profile-name {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 10px;
            color: var(--dark-color);
        }

        .edit-profile-link {
            display: inline-flex;
            align-items: center;
            color: var(--primary-color);
            font-weight: 600;
            text-decoration: none;
            transition: all 0.3s;
        }

        .edit-profile-link:hover {
            color: #ff3355;
            text-decoration: underline;
        }

        .edit-profile-link i {
            margin-right: 8px;
        }

        .profile-details {
            border-top: 1px solid #e9ecef;
            padding-top: 20px;
        }

        .detail-item {
            display: flex;
            margin-bottom: 15px;
            padding-bottom: 15px;
            border-bottom: 1px solid #f1f1f1;
        }

        .detail-item:last-child {
            border-bottom: none;
        }

        .detail-label {
            font-weight: 600;
            width: 120px;
            color: #6c757d;
        }

        .detail-value {
            flex: 1;
            color: var(--dark-color);
        }

        .detail-item__about .detail-value {
            white-space: pre-line;
            line-height: 1.6;
        }

        #deleteForm {
            padding: 0 30px 30px;
            text-align: center;
        }

        .btn-danger {
            background-color: #dc3545;
            border: none;
            border-radius: 50px;
            padding: 10px 25px;
            font-weight: 600;
            transition: all 0.3s;
        }

        .btn-danger:hover {
            background-color: #c82333;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(220, 53, 69, 0.3);
        }

        .btn-danger i {
            margin-right: 8px;
        }

        @media (max-width: 576px) {
            .profile-main-info {
                flex-direction: column;
                text-align: center;
                gap: 15px;
            }

            .profile-name-section {
                width: 100%;
            }

            .edit-profile-link {
                justify-content: center;
            }

            .detail-item {
                flex-direction: column;
            }

            .detail-label {
                width: 100%;
                margin-bottom: 5px;
            }
        }
    </style>
</head>
<body>
<div class="profile-container">
    <div class="profile-card">
        <div class="profile-header">
            <a href="/" class="btn btn-back"><i class="fas fa-arrow-left"></i> Назад</a>
            <h1>Мой профиль</h1>
        </div>

        <div class="profile-content">
            <!-- Блок с фото и именем -->
            <div class="profile-main-info">
                <div class="profile-photo">
                    <img th:if="${mainPhotoUrl}"
                         th:src="@{${mainPhotoUrl}}"
                         alt="Фото профиля">
                    <div th:unless="${mainPhotoUrl}" class="no-photo">
                        <i class="fas fa-user" style="font-size: 3rem; color: #adb5bd;"></i>
                    </div>
                </div>

                <div class="profile-name-section">
                    <h2 class="profile-name" th:text="${profile.name} ?: 'Без имени'"></h2>
                    <a href="/profile/edit" class="edit-profile-link">
                        <i class="fas fa-pencil-alt"></i> Изменить профиль
                    </a>
                </div>
            </div>

            <!-- Детали профиля -->
            <div class="profile-details">
                <div class="detail-item">
                    <span class="detail-label">Возраст:</span>
                    <span class="detail-value" th:text="${profile.age} ?: 'Не указан'"></span>
                </div>

                <div class="detail-item">
                    <span class="detail-label">Пол:</span>
                    <span class="detail-value" th:text="${profile.gender} ?: 'Не указан'"></span>
                </div>

                <div class="detail-item">
                    <span class="detail-label">Город:</span>
                    <span class="detail-value" th:text="${profile.city} ?: 'Не указан'"></span>
                </div>

                <div class="detail-item detail-item__about">
                    <span class="detail-label">О себе:</span>
                    <span class="detail-value" th:text="${profile.bio} ?: 'Не указано'"></span>
                </div>
            </div>

        </div>

        <form th:action="@{/profile/delete}" method="post" id="deleteForm">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <button type="button" class="btn btn-danger" onclick="confirmDelete()">
                <i class="fas fa-trash-alt"></i> Удалить аккаунт
            </button>
        </form>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js"></script>
<script>
    function confirmDelete() {
        if(confirm("Вы уверены, что хотите удалить свой аккаунт? Это действие нельзя отменить.")) {
            document.getElementById('deleteForm').submit();
        }
    }
</script>
</body>
</html>
