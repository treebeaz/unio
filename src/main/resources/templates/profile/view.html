<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Мой профиль | Unio</title>
    <link rel="stylesheet" href="/css/style.css">
</head>

<body>

    <main class="profile-container">
        <div class="profile-card">
            <div class="profile-header">
                <a href="/" class="btn btn-back"><i class="fas fa-arrow-left"></i> Назад</a>
                <h1>Мой профиль</h1>
            </div>

            <div class="profile-content">
                <!-- Блок с фото и именем -->
                <div class="profile-main-info">
                    <div class="profile-photo">
                        <img th:if="${mainPhotoUrl}"
                             th:src="@{${mainPhotoUrl}}"
                             style="width: 150px; height: 150px; object-fit: cover; border-radius: 12px;">
                        <div th:unless="${mainPhotoUrl}" class="no-photo">Нет фото</div>
                    </div>

                    <div class="profile-name-section">
                        <h2 class="profile-name" th:text="${profile.name} ?: 'Без имени'"></h2>
                        <a href="/profile/edit" class="edit-profile-link">
                            <i class="fas fa-pencil-alt"></i> Изменить профиль
                        </a>
                    </div>
                </div>

                <!-- Детали профиля -->
                <div class="profile-details">
                    <div class="detail-item">
                        <span class="detail-label">Возраст:</span>
                        <span class="detail-value" th:text="${profile.age} ?: 'Не указано'"></span>
                    </div>

                    <div class="detail-item">
                        <span class="detail-label">Пол:</span>
                        <span class="detail-value" th:text="${profile.gender} ?: 'Не указан'"></span>
                    </div>

                    <div class="detail-item">
                        <span class="detail-label">Город:</span>
                        <span class="detail-value" th:text="${profile.city} ?: 'Не указан'"></span>
                    </div>

                    <div class="detail-item detail-item__about">
                        <span class="detail-label">О себе:</span>
                        <span class="detail-value" th:text="${profile.bio} ?: 'Не указано'"></span>
                    </div>
                </div>
            </div>

            <form th:action="@{/profile/delete}" method="post" id="deleteForm">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <button type="button" class="btn btn-danger" onclick="confirmDelete()">
                    <i class="fas fa-trash-alt"></i> Удалить аккаунт
                </button>
            </form>
        </div>
    </main>

    <script>
        function confirmDelete() {
            if(confirm("Подтвердите удаление")) {
                document.getElementById('deleteForm').submit();
            }
        }
    </script>

</body>
</html>
