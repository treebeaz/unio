<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Редактирование профиля | Unio</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-color: #ff4d6d;
            --secondary-color: #ff8fa3;
            --dark-color: #2b2d42;
            --light-bg: #f8f9fa;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--light-bg);
            color: var(--dark-color);
        }

        .edit-profile-container {
            max-width: 800px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .profile-card {
            background: white;
            border-radius: 15px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        .profile-header {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            padding: 25px;
            position: relative;
            text-align: center;
        }

        .profile-header h1 {
            font-weight: 700;
            margin: 0;
            font-size: 1.8rem;
        }

        .btn-back {
            position: absolute;
            left: 20px;
            top: 20px;
            color: white;
            background: rgba(255,255,255,0.2);
            border: none;
            border-radius: 50px;
            padding: 8px 15px;
            transition: all 0.3s;
        }

        .btn-back:hover {
            background: rgba(255,255,255,0.3);
            transform: translateX(-3px);
        }

        .edit-section {
            padding: 25px;
            border-bottom: 1px solid #f1f1f1;
        }

        .edit-section:last-child {
            border-bottom: none;
        }

        .edit-section h2 {
            font-size: 1.3rem;
            margin-bottom: 20px;
            color: var(--dark-color);
            display: flex;
            align-items: center;
        }

        .edit-section h2 i {
            margin-right: 10px;
            color: var(--primary-color);
        }
        .photo-container {
            position: relative;
            width: 120px;
            height: 120px;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
        }

        .photos-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 15px;
            margin-bottom: 15px;
        }

        .photo-preview {
            width: 100%;
            height: 120px;
            border-radius: 10px;
            object-fit: cover;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
        }

        .remove-photo {
            position: absolute;
            top: 5px;
            right: 5px;
            width: 25px;
            height: 25px;
            background: rgba(0,0,0,0.5);
            color: white;
            border: none;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .photo-container:hover .remove-photo {
            opacity: 1;
        }

        .photo-upload-container {
            width: 120px;
            height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px dashed #e0e0e0;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            text-align: center;
            color: #6c757d;
        }

        .photo-upload-container:hover {
            border-color: var(--primary-color);
            color: var(--primary-color);
            background: rgba(255, 77, 109, 0.05);
        }

        .photo-upload-container label {
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px;
        }

        .photo-upload-container i {
            font-size: 1.5rem;
            margin-bottom: 8px;
        }

        .photo-upload-container span {
            font-size: 0.9rem;
        }

        .photo-upload {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 120px;
            border: 2px dashed #e0e0e0;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            text-align: center;
            color: #6c757d;
        }

        .photo-upload:hover {
            border-color: var(--primary-color);
            color: var(--primary-color);
            background: rgba(255, 77, 109, 0.05);
        }

        .photo-upload label {
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px;
        }

        .photo-upload i {
            font-size: 1.5rem;
            margin-bottom: 8px;
        }

        .bio-textarea {
            width: 100%;
            min-height: 120px;
            padding: 15px;
            border: 1px solid #e0e0e0;
            border-radius: 10px;
            resize: vertical;
            font-family: inherit;
            transition: all 0.3s;
        }

        .bio-textarea:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 0.25rem rgba(255, 77, 109, 0.15);
            outline: none;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--dark-color);
        }

        .form-group input {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #e0e0e0;
            border-radius: 10px;
            font-size: 1rem;
            transition: all 0.3s;
        }

        .form-group input:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 0.25rem rgba(255, 77, 109, 0.15);
            outline: none;
        }

        .radio-group {
            display: flex;
            gap: 20px;
        }

        .radio-group label {
            display: flex;
            align-items: center;
            cursor: pointer;
        }

        .radio-group input[type="radio"] {
            appearance: none;
            width: 18px;
            height: 18px;
            border: 2px solid #e0e0e0;
            border-radius: 50%;
            margin-right: 8px;
            cursor: pointer;
            position: relative;
            transition: all 0.3s;
        }

        .radio-group input[type="radio"]:checked {
            border-color: var(--primary-color);
        }

        .radio-group input[type="radio"]:checked::after {
            content: '';
            position: absolute;
            width: 10px;
            height: 10px;
            background: var(--primary-color);
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .btn-save {
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 50px;
            padding: 12px 30px;
            font-weight: 600;
            display: block;
            margin: 20px auto;
            transition: all 0.3s;
        }

        .btn-save:hover {
            background-color: #ff3355;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 77, 109, 0.3);
        }

        .btn-save i {
            margin-right: 8px;
        }

        @media (max-width: 576px) {
            .edit-profile-container {
                padding: 0 15px;
            }

            .radio-group {
                flex-direction: column;
                gap: 10px;
            }

            .photos-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        .max-photos-message {
            color: #dc3545;
            font-size: 0.9rem;
            margin-top: 5px;
            display: none;
        }
    </style>
</head>
<body>
<div class="edit-profile-container">
    <div class="profile-card">
        <div class="profile-header">
            <a th:href="@{/profile}" class="btn btn-back"><i class="fas fa-arrow-left"></i> Назад</a>
            <h1>Редактирование профиля</h1>
        </div>

        <form th:action="@{/profile/edit}" method="post" enctype="multipart/form-data">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

            <!-- Секция с фото -->
            <div class="edit-section">
                <h2><i class="fas fa-images"></i> Мои фото </h2>
                <div class="photos-grid" id="photosGrid">
                    <!-- Превью существующих фото -->
                    <th:block th:each="photo : ${photos}">
                        <div class="photo-container">
                            <img th:src="@{${photo.url}}" class="photo-preview">
                            <button type="button" class="remove-photo" data-photo-id="${photo.id}">
                                <i class="fas fa-times"></i>
                            </button>
                        </div>
                    </th:block>

                    <!-- Загрузка нового фото (показываем только если меньше 5 фото) -->
                    <div class="photo-upload" th:if="${#lists.size(photos) < 5}">
                        <label for="photoUpload">Добавить</label>
                        <input id="photoUpload" type="file" name="photo" accept="image/*" hidden>
                    </div>
                </div>
                <div class="max-photos-message" id="maxPhotosMessage">
                    Вы достигли максимального количества фотографий (5)
                </div>
            </div>

            <!-- Секция "Био" -->
            <div class="edit-section">
                <h2><i class="fas fa-user-edit"></i> Био</h2>
                <textarea class="bio-textarea" name="bio" placeholder="Расскажите о себе..."
                          th:text="${profile.bio}"></textarea>
            </div>

            <!-- Основная информация -->
            <div class="edit-section">
                <h2><i class="fas fa-info-circle"></i> Основные</h2>

                <div class="form-group">
                    <label for="name">Имя:</label>
                    <input type="text" id="name" name="name" th:value="${profile.name}" required>
                </div>

                <div class="form-group">
                    <label for="age">Возраст:</label>
                    <input type="number" id="age" name="age" th:value="${profile.age}" min="18" max="100" required>
                </div>

                <div class="form-group">
                    <label for="city">Город:</label>
                    <input type="text" id="city" name="city" th:value="${profile.city}" required>
                </div>

                <div class="form-group">
                    <label>Пол:</label>
                    <div class="radio-group">
                        <label>
                            <input type="radio" name="gender" value="MALE" th:checked="${profile.gender == 'MALE'}" required> Мужской
                        </label>
                        <label>
                            <input type="radio" name="gender" value="FEMALE" th:checked="${profile.gender == 'FEMALE'}"> Женский
                        </label>
                    </div>
                </div>
            </div>

            <button type="submit" class="btn btn-save">
                <i class="fas fa-save"></i> Сохранить изменения
            </button>
        </form>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js"></script>
<script>

    document.addEventListener('DOMContentLoaded', function() {
        const maxPhotos = 5;
        const photosGrid = document.getElementById('photosGrid');
        const photoUpload = document.getElementById('photoUpload');
        const maxPhotosMessage = document.getElementById('maxPhotosMessage');

        // Показываем/скрываем сообщение о максимальном количестве фото
        function updatePhotoUploadVisibility() {
            const currentPhotos = photosGrid.querySelectorAll('.photo-container').length;
            const uploadContainer = photosGrid.querySelector('.photo-upload-container');

            if (currentPhotos >= maxPhotos) {
                if (uploadContainer) uploadContainer.style.display = 'none';
                maxPhotosMessage.style.display = 'block';
            } else {
                if (uploadContainer) uploadContainer.style.display = 'flex';
                maxPhotosMessage.style.display = 'none';
            }
        }

        // Превью загружаемого фото
        photoUpload?.addEventListener('change', function(e) {
            if (this.files && this.files[0]) {
                const currentPhotos = photosGrid.querySelectorAll('.photo-container').length;
                if (currentPhotos >= maxPhotos) return;

                const reader = new FileReader();
                reader.onload = function(e) {
                    const newPhoto = document.createElement('div');
                    newPhoto.className = 'photo-container';
                    newPhoto.innerHTML = `
                            <img src="${e.target.result}" class="photo-preview">
                            <button type="button" class="remove-photo">
                                <i class="fas fa-times"></i>
                            </button>
                        `;

                    // Вставляем перед кнопкой загрузки
                    const uploadContainer = photosGrid.querySelector('.photo-upload-container');
                    if (uploadContainer) {
                        photosGrid.insertBefore(newPhoto, uploadContainer);
                    } else {
                        photosGrid.appendChild(newPhoto);
                    }

                    updatePhotoUploadVisibility();
                };
                reader.readAsDataURL(this.files[0]);
            }
        });

        // Удаление фото
        photosGrid.addEventListener('click', function(e) {
            if (e.target.closest('.remove-photo')) {
                if (confirm('Удалить эту фотографию?')) {
                    const photoContainer = e.target.closest('.photo-container');
                    photoContainer.remove();
                    updatePhotoUploadVisibility();

                    // Здесь можно добавить AJAX-запрос для удаления фото с сервера
                    // если photoContainer.dataset.photoId существует
                }
            }
        });

        // Инициализация при загрузке
        updatePhotoUploadVisibility();
    });
</script>
</body>
</html>
