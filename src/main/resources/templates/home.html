<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Главная</title>
    <link rel="stylesheet" href="/css/style.css">
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: sans-serif;
        }
        .top-right {
            position: absolute;
            top: 20px;
            right: 20px;
        }
        .btn {
            margin-left: 10px;
            padding: 10px 15px;
            background-color: #007bff;
            color: white;
            text-decoration: none;
            border-radius: 4px;
            border: none;
            cursor: pointer;
            display: inline-block;
        }
        .btn:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
<div class="top-right">
    <div th:if="${#authentication == null or !#authentication.authenticated}">
        <a href="/login" class="btn">Войти</a>
        <a href="/register" class="btn">Зарегистрироваться</a>
    </div>
    <div th:if="${#authentication != null and #authentication.authenticated}">
        <span>Вы вошли как: <span th:text="${#authentication.name}"></span></span>
        <a href="/logout" class="btn">Выйти</a>
    </div>
</div>

<!-- Основное содержимое страницы -->
<div style="padding: 50px; text-align: center;">
    <h1>Добро пожаловать!</h1>
    <div th:if="${#authentication != null and #authentication.authenticated}">
        <p>Вы успешно авторизованы в системе</p>
    </div>
</div>
</body>
</html>
