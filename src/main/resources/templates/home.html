<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Главная | Unio</title>
    <link rel="stylesheet" href="/css/style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">

</head>
<body>

<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.min.js" integrity="sha384-VQqxDN0EQCkWoxt/0vsQvZswzTHUVOImccYmSyhJTp7kGtPed0Qcx8rK9h9YEgx+" crossorigin="anonymous"></script>

<header class="header">
    <div th:if="${#authentication == null or !#authentication.authenticated}">
        <a href="/login" class="btn btn-primary">Войти</a>
        <a href="/register" class="btn btn-primary" style="margin-left: 10px;">Регистрация</a>
    </div>
    <div th:if="${#authentication != null and #authentication.authenticated}">
        <span class="user-greeting">Вы вошли как: <strong th:text="${#authentication.name}"></strong></span>
        <form th:action="@{/logout}" method="post" style="display: inline;">
            <button type="submit" class="btn btn-primary">Выйти</button>
        </form>
    </div>
</header>

<main class="hero">
    <h1>Добро пожаловать в Unio</h1>
    <div th:if="${#authentication != null and #authentication.authenticated}">
        <p>Теперь вы можете получить полный доступ ко всем возможностям нашей платформы</p>
        <a href="#" class="btn btn-primary" style="margin-top: 20px;">Перейти в профиль</a>
    </div>
    <div th:unless="${#authentication != null and #authentication.authenticated}">
        <p>Пожалуйста, войдите или зарегистрируйтесь, чтобы получить доступ к системе</p>
    </div>
</main>
</body>
</html>
