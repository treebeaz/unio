<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Главная | Unio</title>
    <link rel="stylesheet" href="/css/style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
<header class="header">
    <div th:if="${#authentication == null or !#authentication.authenticated}">
        <a href="/login" class="btn btn-primary">Войти</a>
        <a href="/register" class="btn btn-primary" style="margin-left: 10px;">Регистрация</a>
    </div>
    <div th:if="${#authentication != null and #authentication.authenticated}">
        <span class="user-greeting">Вы вошли как: <strong th:text="${#authentication.name}"></strong></span>
        <form th:action="@{/logout}" method="post" style="display: inline;">
            <button type="submit" class="btn btn-primary">Выйти</button>
        </form>
    </div>
</header>

<main class="hero">
    <h1>Добро пожаловать в Unio</h1>
    <div th:if="${#authentication != null and #authentication.authenticated}">
        <p>Теперь вы можете получить полный доступ ко всем возможностям нашей платформы</p>
        <a href="#" class="btn btn-primary" style="margin-top: 20px;">Перейти в профиль</a>
    </div>
    <div th:unless="${#authentication != null and #authentication.authenticated}">
        <p>Пожалуйста, войдите или зарегистрируйтесь, чтобы получить доступ к системе</p>
    </div>
</main>
</body>
</html>
