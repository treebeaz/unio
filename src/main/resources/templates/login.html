<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Вход</title>
    <link rel="stylesheet" href="/css/style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>
<header class="header">
    <a href="/" class="btn btn-primary">На главную</a>
</header>

<main class="container">
    <h2 style="text-align: center; margin-bottom: 1.5rem;">Вход в систему</h2>

    <div th:if="${param.error}" class="alert alert-danger">
        Неверный логин или пароль. Пожалуйста, попробуйте снова.
    </div>

    <form th:action="@{/login}" method="post">
        <input type="text" name="username" placeholder="Введите ваш логин" required>
        <input type="password" name="password" placeholder="Введите ваш пароль" required>
        <button type="submit" class="btn btn-primary btn-block">Войти</button>
    </form>

    <p style="text-align: center; margin-top: 1.5rem;">
        Ещё нет аккаунта? <a href="/register">Зарегистрируйтесь</a>
    </p>
</main>
</body>
</html>
