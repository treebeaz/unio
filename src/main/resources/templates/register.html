<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Регистрация | Unio</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-color: #ff4d6d;
            --secondary-color: #ff8fa3;
            --dark-color: #2b2d42;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            background-size: cover;
            min-height: 100vh;
            display: flex;
            align-items: center;
        }

        .auth-container {
            max-width: 400px;
            margin: 0 auto;
            padding: 30px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .auth-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .auth-logo {
            height: 50px;
            margin-bottom: 15px;
        }

        .auth-title {
            font-weight: 700;
            color: var(--dark-color);
            margin-bottom: 5px;
        }

        .auth-subtitle {
            color: #6c757d;
            font-size: 0.9rem;
        }

        .form-control {
            height: 50px;
            border-radius: 10px;
            border: 1px solid #e0e0e0;
            padding-left: 20px;
            margin-bottom: 20px;
            transition: all 0.3s;
        }

        .form-control:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 0.25rem rgba(255, 77, 109, 0.15);
        }

        .btn-auth {
            background-color: var(--primary-color);
            border: none;
            height: 50px;
            border-radius: 10px;
            font-weight: 600;
            width: 100%;
            margin-top: 5px;
            transition: all 0.3s;
        }

        .btn-auth:hover {
            background-color: #ff3355;
            transform: translateY(-2px);
        }

        .auth-footer {
            text-align: center;
            margin-top: 25px;
            color: #6c757d;
            font-size: 0.9rem;
        }

        .auth-link {
            color: var(--primary-color);
            font-weight: 600;
            text-decoration: none;
        }

        .auth-link:hover {
            text-decoration: underline;
        }

        .error-message {
            background-color: #fff5f5;
            color: #dc3545;
            padding: 12px 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            border: 1px solid rgba(220, 53, 69, 0.2);
            font-size: 0.9rem;
            display: flex;
            align-items: center;
        }

        .error-message i {
            margin-right: 8px;
        }

        .password-toggle {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #adb5bd;
        }

        .password-toggle:hover {
            color: var(--primary-color);
        }

        .input-group {
            position: relative;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="auth-container animate__animated animate__fadeIn">
        <div class="auth-header">
            <a href="/"><img src="/images/Logo.png" alt="Unio" class="auth-logo"></a>
            <h2 class="auth-title">Создайте аккаунт</h2>
            <p class="auth-subtitle">Начните знакомства прямо сейчас</p>
        </div>

        <div th:if="${not #strings.isEmpty(error)}" class="error-message">
            <i class="fas fa-exclamation-circle"></i>
            <span th:text="${error}"></span>
        </div>

        <form th:action="@{/register}" method="post">
            <div class="mb-3">
                <input type="text" class="form-control" name="username" placeholder="Придумайте логин" required>
            </div>

            <div class="input-group">
                <input type="password" class="form-control" id="password" name="password" placeholder="Придумайте пароль" required>
                <i class="fas fa-eye password-toggle" id="togglePassword"></i>
            </div>

            <button type="submit" class="btn btn-auth">
                <i class="fas fa-user-plus me-2"></i> Зарегистрироваться
            </button>
        </form>

        <div class="auth-footer">
            Уже есть аккаунт? <a href="/login" class="auth-link">Войти в систему</a>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js"></script>
<script>
    // Переключение видимости пароля
    const togglePassword = document.querySelector('#togglePassword');
    const password = document.querySelector('#password');

    togglePassword.addEventListener('click', function() {
        const type = password.getAttribute('type') === 'password' ? 'text' : 'password';
        password.setAttribute('type', type);
        this.classList.toggle('fa-eye-slash');
    });

    // Плавное появление формы
    document.addEventListener('DOMContentLoaded', function() {
        setTimeout(function() {
            document.querySelector('.auth-container').classList.add('animate__fadeIn');
        }, 100);
    });
</script>
</body>
</html>
