<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Чаты</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f5f7fa;
      margin: 0;
      padding: 0;
    }

    .nav-tabs {
      position: fixed;
      left: 0;
      top: 50%;
      transform: translateY(-50%);
      background: white;
      border-radius: 0 10px 10px 0;
      box-shadow: 2px 2px 10px rgba(0, 0, 0, 0.1);
      z-index: 1000;
      padding: 10px 0;
    }

    .nav-tabs .nav-link {
      padding: 15px 20px;
      color: #555;
      text-decoration: none;
      display: flex;
      align-items: center;
      transition: all 0.3s;
    }

    .nav-tabs .nav-link.active {
      color: #4b7bec;
      background-color: #f0f4f8;
    }

    .nav-tabs .nav-link:hover:not(.active) {
      color: #4b7bec;
      background-color: #f8f9fa;
    }

    .nav-tabs .nav-link i {
      margin-right: 8px;
      font-size: 1.2rem;
    }

    .main-container {
      margin-left: 80px;
      padding: 20px;
      max-width: 1200px;
      margin: 0 auto;
    }

    .header {
      text-align: center;
      margin-bottom: 30px;
    }

    .header h2 {
      color: #333;
      font-size: 2rem;
    }

    .chat-container {
      display: flex;
      background: white;
      border-radius: 15px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      overflow: hidden;
      height: calc(100vh - 200px);
    }

    .sidebar {
      width: 30%;
      border-right: 1px solid #eaeaea;
      overflow-y: auto;
      padding: 20px;
    }

    .sidebar h3 {
      color: #333;
      margin-bottom: 20px;
      font-size: 1.3rem;
      padding-bottom: 10px;
      border-bottom: 1px solid #eee;
    }

    .chat-list {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .chat-item {
      padding: 12px 15px;
      border-radius: 10px;
      margin-bottom: 10px;
      transition: all 0.3s;
      cursor: pointer;
    }

    .chat-item:hover {
      background-color: #f5f7fa;
    }

    .chat-item.active {
      background-color: #e3f2fd;
    }

    .chat-item a {
      text-decoration: none;
      color: #333;
      display: flex;
      align-items: center;
    }

    .chat-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background-color: #4b7bec;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-right: 12px;
      font-weight: bold;
    }

    .chat-content {
      flex: 1;
    }

    .chat-name {
      font-weight: 600;
      margin-bottom: 3px;
    }

    .chat-preview {
      font-size: 0.9rem;
      color: #777;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .chat-window {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 0;
    }

    .chat-header {
      padding: 20px;
      border-bottom: 1px solid #eaeaea;
      display: flex;
      align-items: center;
    }

    .chat-header h3 {
      margin: 0;
      color: #333;
      font-size: 1.2rem;
    }

    .messages-container {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      background-color: #f9f9f9;
    }

    .message {
      margin-bottom: 15px;
      display: flex;
      flex-direction: column;
    }

    .message.me {
      align-items: flex-end;
    }

    .message.other {
      align-items: flex-start;
    }

    .message-content {
      max-width: 70%;
      padding: 12px 16px;
      border-radius: 18px;
      position: relative;
      word-wrap: break-word;
    }

    .message.me .message-content {
      background-color: #4b7bec;
      color: white;
      border-top-right-radius: 5px;
    }

    .message.other .message-content {
      background-color: white;
      color: #333;
      border-top-left-radius: 5px;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.1);
    }

    .message-sender {
      font-weight: 600;
      font-size: 0.8rem;
      margin-bottom: 5px;
      color: #666;
    }

    .message-time {
      font-size: 0.7rem;
      color: #999;
      margin-top: 5px;
      text-align: right;
    }

    .chat-input {
      padding: 15px;
      border-top: 1px solid #eaeaea;
      background-color: white;
    }

    .message-form {
      display: flex;
      gap: 10px;
    }

    .message-input {
      flex: 1;
      padding: 12px 15px;
      border: 1px solid #ddd;
      border-radius: 25px;
      outline: none;
      transition: all 0.3s;
    }

    .message-input:focus {
      border-color: #4b7bec;
    }

    .send-button {
      background-color: #4b7bec;
      color: white;
      border: none;
      border-radius: 50%;
      width: 45px;
      height: 45px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.3s;
    }

    .send-button:hover {
      background-color: #3867d6;
    }

    .empty-chat {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: #777;
    }

    .empty-chat i {
      font-size: 3rem;
      margin-bottom: 15px;
      color: #ccc;
    }
  </style>
</head>
<body>
<ul class="nav nav-tabs flex-column">
  <li class="nav-item">
    <a class="nav-link" href="/discover">
      <i class="fas fa-users"></i>
      <span class="d-none d-md-inline"> Discover</span>
    </a>
  </li>
  <li class="nav-item">
    <a class="nav-link active" href="/chats">
      <i class="fas fa-comments"></i>
      <span class="d-none d-md-inline"> Chats</span>
    </a>
  </li>
</ul>

<div class="main-container">
  <div class="header">
    <h2>Добро пожаловать, <span th:text="${user.username}">User</span>!</h2>
  </div>

  <div class="chat-container">
    <div class="sidebar">
      <h3>Мои чаты</h3>
      <ul class="chat-list">
        <li th:each="chat : ${chats}"
            th:class="${'chat-item' + (currentChat != null && chat.id == currentChat.id ? ' active' : '')}">
          <a th:href="@{'/chats/' + ${chat.id} + '?userId=' + ${user.id}}">
            <div class="chat-avatar"
                 th:text="${chat.user1.id == user.id} ?
                 ${chat.user2.username.substring(0, 1)} :
                 ${chat.user1.username.substring(0, 1)}">
            </div>
            <div class="chat-content">
              <div class="chat-name"
                   th:text="${chat.user1.id == user.id} ?
                   ${chat.user2.username} :
                   ${chat.user1.username}">
              </div>
              <div class="chat-preview">Последнее сообщение...</div>
            </div>
          </a>
        </li>
      </ul>
    </div>

    <div class="chat-window" th:if="${currentChat != null}">
      <div class="chat-header">
        <h3>Чат с
          <span th:text="${currentChat.user1.id == user.id} ?
                ${currentChat.user2.username} :
                ${currentChat.user1.username}"></span>
        </h3>
      </div>

      <div class="messages-container">
        <div th:each="msg : ${messages}"
             th:class="'message ' + (${msg.sender.id} == ${user.id} ? 'me' : 'other')">
          <div class="message-sender" th:text="${msg.sender.username}"></div>
          <div class="message-content" th:text="${msg.content}"></div>
          <div class="message-time" th:text="${#temporals.format(msg.timestamp, 'HH:mm')}"></div>
        </div>
      </div>

      <div class="chat-input">
        <form th:action="@{'/chats/' + ${currentChat.id} + '/send'}" method="post" class="message-form">
          <input type="hidden" name="userId" th:value="${user.id}" />
          <input type="text" name="content" placeholder="Введите сообщение..." class="message-input" required />
          <button type="submit" class="send-button">
            <i class="fas fa-paper-plane"></i>
          </button>
        </form>
      </div>
    </div>

    <div class="chat-window" th:if="${currentChat == null}">
      <div class="empty-chat">
        <i class="fas fa-comment-dots"></i>
        <p>Выберите чат для начала общения</p>
      </div>
    </div>
  </div>
</div>
</body>
</html>
